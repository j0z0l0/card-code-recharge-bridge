name: validate-skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Skill package
        run: python scripts/validate_skill.py .
      - name: Check Python syntax
        run: python -m compileall -q scripts
